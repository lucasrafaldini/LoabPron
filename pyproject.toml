[project]
name = "loabpron"
version = "1.0.0"
description = "Um web riddle de horror no espírito do Notpron, assombrado por um Gemma local."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas Rafaldini" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "rcssmin>=1.1",
    "rjsmin>=1.2",
    "pillow>=13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
